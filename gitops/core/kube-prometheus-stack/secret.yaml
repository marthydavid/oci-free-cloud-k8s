apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-envoy-client
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: dex-envoy-client
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .pw }}"
  data:
    - secretKey: pw
      remoteRef:
        key: oci-k8s/dex-envoy-client-secret
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack-webhook
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: alertmanager-slack-webhook
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        url: "{{ .url }}"
  data:
    - secretKey: url
      remoteRef:
        key: oci-k8s/SLACK_API_URL
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-remote-write-basic-auth
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: prometheus-remote-write-basic-auth
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        ".htpasswd": "{{ .htpasswd }}"
  data:
    - secretKey: htpasswd
      remoteRef:
        key: oci-k8s/prometheus-remote-write-htpasswd
        property: value
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: prometheus-remote-write-basic-auth
spec:
  length: 40
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-remote-write-basic-auth-generated
spec:
  refreshPolicy: CreatedOnce
  target:
    name: prometheus-remote-write-basic-auth-generated
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: prometheus
        password: "{{ .password | toString }}"
        ".htpasswd": '{{ htpasswd "prometheus" (.password | toString) "sha" }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: prometheus-remote-write-basic-auth
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: prometheus-remote-write-basic-auth
spec:
  refreshInterval: 3m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: vault
  selector:
    secret:
      name: prometheus-remote-write-basic-auth-generated
  data:
    - match:
        secretKey: ".htpasswd"
        remoteRef:
          remoteKey: prometheus-remote-write-htpasswd
    - match:
        secretKey: username
        remoteRef:
          remoteKey: prometheus-remote-write-username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: prometheus-remote-write-password
