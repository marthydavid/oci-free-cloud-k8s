apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-secrets
  namespace: external-dns
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: external-dns-config
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        accessKeyId: "{{ .id }}"
        secretAccessKey: "{{ .secret }}"
  data:
    - secretKey: id
      remoteRef:
        key: aws-route53-access-key-id
        version: CURRENT
    - secretKey: secret
      remoteRef:
        key: aws-route53-secret-access-key
        version: CURRENT
