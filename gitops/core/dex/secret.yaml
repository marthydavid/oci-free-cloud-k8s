apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-entra-connector
  namespace: dex
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: dex-entra-connector
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: ENTRA_CLIENT_ID
      remoteRef:
        key: oci-k8s/entra-dex-client-id
        property: value
    - secretKey: ENTRA_CLIENT_SECRET
      remoteRef:
        key: oci-k8s/entra-dex-client-secret
        property: value
    - secretKey: ENTRA_TENANT_ID
      remoteRef:
        key: oci-k8s/entra-tenant-id
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-grafana-client
  namespace: dex
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: dex-grafana-client
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        grafana.client-id: grafana
        grafana.client-secret: "{{ .pw }}"
  data:
    - secretKey: pw
      remoteRef:
        key: oci-k8s/dex-grafana-client
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-envoy-client
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: dex-envoy-client
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        envoy.client-id: envoy-gateway
        envoy.client-secret: "{{ .pw }}"
  data:
    - secretKey: pw
      remoteRef:
        key: oci-k8s/dex-envoy-client-secret
        property: value
