apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-entra-connector
  namespace: dex
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: dex-entra-connector
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: ENTRA_CLIENT_ID
      remoteRef:
        key: entra-dex-client-id
        version: CURRENT
        decodingStrategy: None
    - secretKey: ENTRA_CLIENT_SECRET
      remoteRef:
        key: entra-dex-client-secret
        version: CURRENT
        decodingStrategy: None
    - secretKey: ENTRA_TENANT_ID
      remoteRef:
        key: entra-tenant-id
        version: CURRENT
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-grafana-client
  namespace: dex
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: dex-grafana-client
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        grafana.client-id: grafana
        grafana.client-secret: "{{ .pw }}"
  data:
    - secretKey: pw
      remoteRef:
        key: dex-grafana-client
        version: CURRENT
        decodingStrategy: None
---
