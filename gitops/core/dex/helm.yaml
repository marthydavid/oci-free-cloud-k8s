apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: dex
  namespace: dex
spec:
  interval: 5m
  url: https://charts.dexidp.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: dex
  chart:
    spec:
      chart: dex
      version: '0.24.1'
      sourceRef:
        kind: HelmRepository
        name: dex
      interval: 5m
  releaseName: dex
  values:
    envFrom:
      - secretRef:
          name: dex-entra-connector
      - secretRef:
          name: dex-grafana-client
      - secretRef:
          name: dex-envoy-client
    replicaCount: 2
    https:
      enabled: false
    ingress:
      enabled: false
    config:
      issuer: https://login.oci.marthy.xyz/dex/
      # The storage configuration determines where dex stores its state. Supported
      # options include SQL flavors and Kubernetes third party resources.
      #
      # See the documentation (https://dexidp.io/docs/storage/) for further information.
      storage:
        type: kubernetes
        config:
          inCluster: true

      # Configuration for the HTTP endpoints.
      web:
        http: 0.0.0.0:5556
      # Configuration for telemetry
      telemetry:
        http: 0.0.0.0:5558

      # Instead of reading from an external storage, use this list of clients.
      #
      # If this option isn't chosen clients may be added through the gRPC API.
      staticClients:
        - name: Envoy
          IDEnv: envoy.client-id
          secretEnv: envoy.client-secret
          redirectURIs:
            - https://prometheus.oci.marthy.xyz/oauth2/callback
        - name: Grafana
          IDEnv: grafana.client-id
          secretEnv: grafana.client-secret
          redirectURIs:
            - https://monitoring.oci.marthy.xyz/login/generic_oauth
      connectors:
        - type: microsoft
          id: entra
          name: Microsoft Entra ID
          config:
            clientID: $ENTRA_CLIENT_ID
            clientSecret: $ENTRA_CLIENT_SECRET
            tenant: $ENTRA_TENANT_ID
            redirectURI: https://login.oci.marthy.xyz/dex/callback
            # emit group names (not object IDs); needs "GroupMember.Read.All"
            groupNameFormat: name
            # only these Entra groups end up in the token's groups claim
            groups:
              - admin

      # Let dex keep a list of passwords which can be used to login to dex.
      enablePasswordDB: false
