apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: route53-credentials
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: route53-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        access-key-id: "{{ .id }}"
        secret-access-key: "{{ .secret }}"
  data:
    - secretKey: id
      remoteRef:
        key: aws-route53-access-key-id
        property: value
    - secretKey: secret
      remoteRef:
        key: aws-route53-secret-access-key
        property: value
